# MindFormers reference recipe for the Xing4.0-29B 4-layer alignment.
#
# Code:   mindformers @ 472349f66919476f14aea17f56f49475ce89af03
#         (recorded in the image as fork Somnus2020/mindformers_formal_v1.0, master)
# Image:  ms-r211-ops-base:20261014, container ds3-align (/opt/src/mindformers)
# Launch: python run_mindformer.py --config /work/mf_4l_2000sizes.yaml --mode 1
# Data:   /host/mmap_deepseekv3_datasets_text_document, sizes [2000, 0, 0], seq 4096
# Loads the shared step-200 checkpoint (/work/state/mf-step200) and runs 201-2000.
#
# Derived from deepseek-v3-29b-8card/base.yaml (net-regression-suite): same 4-layer
# model, Muon and mHC settings; only the dataset, steps (2000), batch (1/1) and
# checkpoint load differ. mHC is NOT fused here (use_fused_mhc: false).
# The HP counterpart is this repository's xing40 recipe with num_hidden_layers=4,
# global_batch_size=1 and the step-200 DCP restore.

run_mode: train
checkpoint:
  enable_save: false
  save_path: /work/state/mf-step200
  save_max: 1
  no_save_optim: false
  async_save: false
  prefix: custom
  remove_redundancy: false
  load_path: /work/state/mf-step200
  no_load_optim: false
  load_worker_number: 1
training:
  steps: 2000
  local_batch_size: 1
  global_batch_size: 1
  max_norm: 1.0
  seed: 42
  deterministic: false
optimizer:
  type: Muon
  weight_decay: 0.1
  matched_adamw_rms: 0.2
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  adamw_betas:
  - 0.95
  - 0.95
  adamw_eps: 1.0e-08
  qk_clip_threshold: 100
  qk_clip_enabled: true
  comm_strategy: allgather_deredundency
  use_fused_adamw: true
lr_scheduler:
  type: ConstantWarmUpLR
  learning_rate: 1.0e-05
  warmup_ratio: 0
parallelism:
  data_parallel_shard: -1
  data_parallel_shard_strategy: optim_grads_params
  tensor_parallel: 1
  sequence_parallel: false
  context_parallel: 1
  context_parallel_method: colossal
  expert_parallel: 1
  moe_token_dispatcher_type: alltoall
  pipeline_parallel: 1
  pipeline_parallel_schedule: 1f1b
  pipeline_parallel_microbatch_size: 1
  pipeline_parallel_interleave_num: 1
  pipeline_parallel_layers_per_stage: null
recompute:
  mode: full
  full_recompute_layer:
  - 0-3
train_dataset:
  dataloader:
    type: BlendedMegatronDatasetDataLoader
    datasets_type: GPTDataset
    sizes:
    - 2000
    - 0
    - 0
    config:
      split: 1, 0, 0
      seq_length: 4096
      eod_mask_loss: false
      reset_position_ids: false
      create_attention_mask: false
      reset_attention_mask: false
      create_compressed_eod_mask: false
      eod_pad_length: 128
      eod: 1
      pad: -1
      data_path:
      - '1'
      - /host/mmap_deepseekv3_datasets_text_document
      path_to_cache: /work/cache
    column_names:
    - input_ids
    - labels
    - loss_mask
    - position_ids
    shuffle: false
    python_multiprocessing: false
  drop_remainder: true
  num_parallel_workers: 8
  prefetch_size: 1
  numa_enable: false
model:
  model_type: deepseek_v3
  architectures: DeepseekV3ForCausalLM
  chunk_loss_num: 4
  apply_rope_fusion: true
  vocab_size: 131072
  seq_length: 4096
  hidden_size: 3584
  intermediate_size: 9216
  num_hidden_layers: 4
  max_position_embeddings: 4096
  hidden_act: fusedswiglu
  num_attention_heads: 32
  rms_norm_eps: 1.0e-06
  add_bias_linear: false
  use_flash_attention: true
  multi_latent_attention: true
  kv_lora_rank: 512
  q_lora_rank: 768
  qk_rope_head_dim: 64
  qk_nope_head_dim: 128
  v_head_dim: 128
  qk_layernorm: true
  attention_dropout: 0.0
  hidden_dropout: 0.0
  params_dtype: bfloat16
  compute_dtype: bfloat16
  layernorm_compute_dtype: float32
  softmax_compute_dtype: float32
  rotary_dtype: float32
  initializer_range: 0.02
  num_nextn_predict_layers: 0
  mtp_loss_scaling_factor: 0.0
  position_embedding_type: rope
  scaling_factor: 40
  beta_fast: 32
  beta_slow: 1
  mscale: 1
  mscale_all_dim: 1
  rope_theta: 10000
  enable_hyper_connections: true
  num_residual_streams: 4
  mhc_sinkhorn_iterations: 20
  mhc_init_gating_factor: 0.01
  use_fused_mhc: false
  router_dense_type: float32
  gated_linear_unit: true
  moe_intermediate_size: 1024
  routed_scaling_factor: 2.0
  first_k_dense_replace: 2
  n_routed_experts: 64
  num_experts_per_tok: 4
  n_shared_experts: 1
  moe_permute_fusion: true
  moe_shared_expert_intermediate_size: 1024
  moe_grouped_gemm: true
  moe_router_load_balancing_type: seq_aux_loss
  moe_aux_loss_coeff: 0.0006
  scoring_func: sigmoid
  norm_topk_prob: true
  moe_token_drop_policy: probs
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 0.001
  use_pad_tokens: true
  topk_group: 0
  n_group: 0
output_dir: /work/output/mf-2000sizes
load_checkpoint: ''
compute_dtype: bfloat16
context:
  max_device_memory: 58GB
trainer:
  model_name: deepseekv3
runner_wrapper:
  use_clip_grad: true
use_parallel: true
auto_trans_ckpt: false
