# JT 256K, single node / eight 910B cards, pure FSDP8.
# Preserve 128 attention heads, 1 Dense + 2 MoE trunk layers and 1 MTP layer.
# Requires head-chunked JT MLA and forward-only MoE auxiliary-loss caching.
# Set the prepared Arrow and matching converted model.npz paths below.
# Launch with PYTORCH_NPU_ALLOC_CONF=expandable_segments:True; ten-step validation:
# torchrun --standalone --nproc_per_node=8 examples/training_demo/train_text.py <this.yaml> \
#   --training.train_samples=null --training.train_iters=10 --memory.mem_info=true
accelerator:
  cp_size: 1
  ep_size: 1
  loss_parallel: false
  pp_size: 1
  sequence_parallel: false
  tp_size: 1
activation_checkpoint:
  mode: full
activation_swap: none
checkpoint:
  checkpoint_dir: ./outputs/jt_256k_8card/checkpoints
  save_ckpt: false
dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.batching.build_online_text_collate_fn
  drop_last: true
  get_batch:
    _target_: hyper_parallel.data.batching.TextParallelBatch
    attention_mode: compressed
    reset_position_ids: true
    runtime_input_adapter:
      _target_: hyper_parallel.models.jt_deepseek_v3.adapter.data.runtime.JTSequenceRuntime
    source_type: online
  num_workers: 4
  prefetch_factor: 1
  sampler_type: cyclic
dataset:
  _target_: hyper_parallel.data.online.mapping.MappingTransformDataset
  data_transform:
    _target_: hyper_parallel.data.text.text_transform.PreTokenizedSFTTransform
  model_assets:
    tokenizer: null
  source_dataset:
    _target_: datasets.load_from_disk
    dataset_path: /path/to/sft_data_256k_demo
fsdp_config:
  dp_shard_size: 8
  mix_precision:
    cast_forward_inputs: false
    param_dtype: bfloat16
    reduce_dtype: float32
  forward_prefetch_depth: 0
  backward_prefetch_depth: 0
loss_fn:
  _target_: hyper_parallel.components.losses.ModelOutputLoss
lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_config:
    lr: 2.4e-05
    lr_decay_ratio: 1.0
    lr_warmup_steps: 50
    min_lr: 2.4e-06
  lr_decay_style: cosine
model:
  _target_: hyper_parallel.models.jt_deepseek_v3.adapter.jt_builder.build_jt_model
  config:
    architectures:
    - JTDeepseekV3ForCausalLM
    attention_bias: false
    attention_dropout: 0.0
    first_k_dense_replace: 1
    hidden_act: silu
    hidden_size: 128
    loss_chunk_size: 4096
    initializer_range: 0.02
    intermediate_size: 12288
    kv_lora_rank: 512
    layer_types:
    - full_attention
    - full_attention
    - full_attention
    max_position_embeddings: 262400
    mlp_bias: false
    mlp_layer_types:
    - dense
    - sparse
    - sparse
    moe_aux_loss_coeff: 0.0001
    moe_intermediate_size: 1536
    moe_router_bias_update_rate: 0.001
    moe_router_enable_expert_bias: true
    mtp_loss_factor: 0.3
    n_group: 1
    n_routed_experts: 6
    n_shared_experts: 2
    norm_topk_prob: true
    num_attention_heads: 128
    num_experts_per_tok: 6
    num_hidden_layers: 3
    num_key_value_heads: 128
    num_nextn_predict_layers: 1
    q_lora_rank: 1536
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    rms_norm_eps: 1.0e-06
    rope_interleave: true
    rope_parameters:
      rope_theta: 5000000
      rope_type: default
    routed_scaling_factor: 2.827
    tie_word_embeddings: false
    topk_group: 1
    use_cache: false
    use_pad_tokens: true
    v_head_dim: 128
    vocab_size: 152064
    attention_head_chunk_size: 8
  reference_weights: /path/to/jt_256k_8card_weights
model_init_dtype: float32
optimizer:
  _target_: hyper_parallel.models.jt_deepseek_v3.adapter.runtime.jt_optimizer.build_optimizer
  adamw_config:
    adamw_betas:
    - 0.9
    - 0.95
    adamw_eps: 1.0e-08
    adamw_lr: 2.4e-05
    adamw_weight_decay: 0.1
  fp32_main_params: true
  muon_config:
    lr: 2.4e-05
    matched_adamw_rms: 0.2
    momentum: 0.95
    nesterov: true
    ns_epsilon: 1.0e-07
    ns_steps: 5
    ns_variant: legacy
    weight_decay: 0.1
  qk_clip_threshold: 100.0
plan_overrides:
- exact_type: true
  match:
  - model.layers.*.self_attn
  - mtp.layers.*.transformer_layer.self_attn
  module_type: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3Attention
  replace_module:
    _target_: hyper_parallel.models.jt_deepseek_v3.modeling_jt_deepseek_v3.JTDeepseekV3MLAAttention
- match: '*.self_attn'
  params:
    kv_b_proj.weight:
      tp: shard(0)
    linear_qkv.weight:
      tp: replicate
    o_proj.weight:
      tp: shard(1)
    q_b_proj.weight:
      tp: shard(0)
  region_dispatch: false
- match: '*.mlp.shared_experts'
  params:
    down_proj.weight:
      tp: replicate
    gate_proj.weight:
      tp: replicate
    up_proj.weight:
      tp: replicate
- match: mtp.layers.*.eh_proj
  params:
    weight:
      tp: replicate
training:
  backend: hccl
  enable_full_determinism: false
  global_batch_size: 8
  lr_scheduler_iters: 10
  max_grad_norm: 1.0
  micro_batch_size: 1
  seed: 42
  train_samples: 500
